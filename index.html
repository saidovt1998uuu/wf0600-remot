<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تحكم الغسالة WF0600</title>

<!-- PWA / "Add to Home Screen" -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14171C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="الغسالة">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<!-- MQTT.js (MQTT-over-WebSockets client) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>

<style>
:root{
  --bg:#14171C; --panel:#1F242C; --panel-2:#262C36;
  --accent-run:#E8A33D; --accent-ok:#4CAF7D; --accent-danger:#E0584F;
  --text:#ECEEF1; --text-dim:#8A93A3; --border:#2D333D; --radius:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text);
  font-family:'Cairo',sans-serif;
  min-height:100vh;
  padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right))
          max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));
}
.app{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:16px;min-height:calc(100vh - 24px);}

header{display:flex;justify-content:space-between;align-items:center;padding:4px 2px;}
header .eyebrow{font-size:.72rem;letter-spacing:.12em;color:var(--text-dim);font-weight:700;}
header .title{font-size:1.15rem;font-weight:900;}
.pill{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--border);
      border-radius:999px;padding:6px 12px;font-size:.78rem;color:var(--text-dim);}
.dot{width:9px;height:9px;border-radius:50%;background:#555;flex:none;transition:.3s;}
.dot.online{background:var(--accent-ok);box-shadow:0 0 8px var(--accent-ok);}
.dot.offline{background:var(--accent-danger);}

.banner{background:var(--panel);border:1px solid var(--border);border-radius:12px;
        padding:10px 14px;font-size:.85rem;text-align:center;color:var(--text-dim);}
.banner.warn{border-color:var(--accent-danger);color:var(--accent-danger);}

.porthole-wrap{display:flex;justify-content:center;padding:8px 0 0;}
.porthole{position:relative;width:230px;height:230px;flex:none;}
.porthole svg.ring{transform:rotate(-90deg);position:absolute;inset:0;}
.ring-bg{stroke:var(--panel-2);}
.ring-fg{stroke:var(--accent-run);stroke-linecap:round;
         transition:stroke-dashoffset 1s linear, stroke .4s ease;}
.drum{position:absolute;inset:19px;border-radius:50%;background:var(--panel);
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      overflow:hidden;border:1px solid var(--border);}
.clothes{position:absolute;width:70%;height:70%;opacity:.16;}
.drum.spin .clothes{animation:spin 5s linear infinite;}
.clothes circle{fill:var(--text-dim);}
@keyframes spin{to{transform:rotate(360deg);}}

.timer{font-family:'Share Tech Mono',monospace;font-size:2.7rem;font-weight:700;
       line-height:1;direction:ltr;letter-spacing:.04em;z-index:1;}
.subreadout{font-family:'Share Tech Mono',monospace;font-size:.95rem;color:var(--text-dim);
            margin-top:6px;direction:ltr;z-index:1;}
.phase-label{text-align:center;font-size:1.05rem;font-weight:700;min-height:1.4em;}

.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
       padding:16px;display:flex;flex-direction:column;gap:10px;}
.btn-row{display:flex;gap:8px;}
.btn{flex:1;padding:14px 10px;border-radius:12px;border:1px solid var(--border);
     background:var(--panel-2);color:var(--text);font-family:inherit;
     font-size:.95rem;font-weight:700;cursor:pointer;transition:.15s;text-align:center;line-height:1.5;}
.btn small{display:block;font-weight:400;font-size:.72rem;color:var(--text-dim);}
.btn.selected{background:var(--accent-run);color:#1A1306;border-color:var(--accent-run);}
.btn.selected small{color:#1A1306cc;}
.btn.primary{background:var(--accent-run);color:#1A1306;border:none;padding:16px;font-size:1.1rem;}
.btn.danger{background:var(--accent-danger);color:#fff;border:none;}
.btn.success{background:var(--accent-ok);color:#06231A;border:none;}
.btn.ghost{background:transparent;}
.btn:active{transform:scale(.97);}

.alert{border:1px solid var(--accent-run);color:var(--accent-run);border-radius:12px;
       padding:12px;font-size:.88rem;text-align:center;line-height:1.6;}
.alert.ok{border-color:var(--accent-ok);color:var(--accent-ok);}
.alert.danger{border-color:var(--accent-danger);color:var(--accent-danger);}

#toast{position:fixed;bottom:max(20px,env(safe-area-inset-bottom));left:50%;
       transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--border);
       padding:10px 18px;border-radius:30px;font-size:.85rem;opacity:0;
       transition:opacity .3s, bottom .3s;pointer-events:none;max-width:90%;text-align:center;
       box-shadow:0 4px 20px rgba(0,0,0,.4);}
#toast.show{opacity:1;}

footer{margin-top:auto;text-align:center;font-size:.7rem;color:var(--text-dim);padding:8px 0 2px;}

@media(prefers-reduced-motion:reduce){.drum.spin .clothes{animation:none;}}
</style>
</head>
<body>
<div class="app">

  <header>
    <div>
      <div class="eyebrow">SAMSUNG WF0600NCS</div>
      <div class="title">التحكم عن بعد</div>
    </div>
    <div class="pill"><span class="dot" id="dot"></span><span id="dotLabel">—</span></div>
  </header>

  <div class="banner" id="connBanner" style="display:none"></div>

  <div class="porthole-wrap">
    <div class="porthole">
      <svg class="ring" viewBox="0 0 230 230">
        <circle class="ring-bg" cx="115" cy="115" r="100" stroke-width="10" fill="none"/>
        <circle id="ringFg" class="ring-fg" cx="115" cy="115" r="100" stroke-width="10" fill="none"
                stroke-dasharray="628.3" stroke-dashoffset="628.3"/>
      </svg>
      <div class="drum" id="drum">
        <svg class="clothes" viewBox="0 0 100 100">
          <circle cx="28" cy="28" r="9"/><circle cx="72" cy="34" r="6"/>
          <circle cx="40" cy="70" r="8"/><circle cx="74" cy="68" r="5"/>
        </svg>
        <div class="timer" id="timer">--:--</div>
        <div class="subreadout" id="subread">— RPM</div>
      </div>
    </div>
  </div>

  <div class="phase-label" id="phaseLabel">جارٍ الاتصال...</div>

  <div class="panel" id="panel"></div>

  <footer>washer/wf0600 · MQTT</footer>
</div>

<div id="toast"></div>

<script>
// ============================================================================
// CONFIG — fill these in (same broker/credentials as the ESP32 sketch)
// ============================================================================
const MQTT_HOST     = "e48091ba93aa430f98759be6105ce17a.s1.eu.hivemq.cloud";
const MQTT_WSS_PORT = 8884;                 // MQTT-over-WebSockets (TLS)
const MQTT_USER     = "fdfsdfgfdfghgfdfghgfdfgh"; // can be the SAME credentials as
const MQTT_PASS     = "54!g@N6WkjXR!Pii"; // the ESP32, or a separate user
const DEVICE_ID     = "wf0600";

const TOPIC_STATUS = `washer/${DEVICE_ID}/status`;
const TOPIC_AVAIL  = `washer/${DEVICE_ID}/availability`;
const TOPIC_CMD    = `washer/${DEVICE_ID}/cmd`;
const TOPIC_ACK    = `washer/${DEVICE_ID}/cmd/ack`;

// ============================================================================
// TRANSLATIONS (Mega's English STAT labels -> Arabic)
// ============================================================================
const LABELS = {
  // Q15 sub-states (q15StateName)
  PreDrain:'تصريف أولي', FillMain:'تعبئة الماء', WetSat:'ترطيب الغسيل',
  MainWash:'غسيل رئيسي', DrainWash:'تصريف ماء الغسيل', InterDewater:'تجفيف وسيط',
  RinseFill:'تعبئة الشطف', RinseAgit:'شطف', FinalDrain:'تصريف نهائي',
  Scatter:'توزيع الغسيل', BalPreRev:'تحضير التوازن', BalRamp:'فحص التوازن',
  BalMeasure:'قياس التوازن', SpinPermit:'تجهيز العصر', FinalSpin:'عصر نهائي',
  EndCoast:'إيقاف تدريجي',
  // SPIN phases (spinPhaseName)
  'Soft Stop':'إيقاف تدريجي', 'Distributing':'توزيع الغسيل', 'OOB Chk 1':'فحص التوازن',
  'Plastering':'تثبيت الغسيل', '400 OOB+Hold':'عصر 400', '600 RPM Hold':'عصر 600',
  '800 RPM Hold':'عصر 800', '1000RPM Hold':'عصر 1000', 'Unwrap Ramp':'فك التشابك',
  'Appr OOB':'الاقتراب من فحص التوازن', 'Plstr Ramp':'تسريع التثبيت',
  'Reso Xng 1':'تجاوز رنين 1', 'Reso Xng 2':'تجاوز رنين 2',
  'Ramp->600':'تسريع إلى 600', 'Ramp->800':'تسريع إلى 800', 'Ramp->1000':'تسريع إلى 1000',
  'Running':'قيد التشغيل',
  // overall status labels
  PAUSING:'إيقاف آمن جارٍ...', PAUSED:'متوقفة مؤقتاً', Done:'اكتملت', Fault:'عطل', Idle:'في الانتظار'
};

const PROGRAM_NAMES = { Q15:'غسلة سريعة', SPIN:'دورة عصر', NONE:'—' };
const PROGRAM_SUB   = { Q15:'١٥ دقيقة', SPIN:'٥ دقائق' };
const PROGRAM_TOTAL = { Q15:900, SPIN:300 };

const ERR_MESSAGES = {
  'ERR busy':'الجهاز يعمل بدورة أخرى حالياً',
  'ERR not_paused':'لا توجد دورة متوقفة لاستئنافها',
  'ERR idle':'لا توجد دورة قيد التشغيل',
  'ERR cap':'سرعة العصر غير صالحة',
  'ERR program':'اسم البرنامج غير صالح',
  'ERR args':'أمر ناقص',
  'ERR unknown':'أمر غير معروف'
};

// ============================================================================
// STATE
// ============================================================================
let status = { mode:'IDLE', program:'NONE', remainSec:0, actualRpm:0, capRpm:600, flags:0, label:'Idle' };
let deviceOnline   = false;
let mqttConnected  = false;
let selProgram     = 'Q15';
let selCap         = 600;
let changingProgram = false;   // showing the "تغيير البرنامج" selector while PAUSED
let forceSelector   = false;   // "دورة جديدة" pressed on the DONE screen
let displayRemain   = 0;
let countdownTimer  = null;

const RING_C = 628.3;
const pad = n => String(n).padStart(2,'0');

// ============================================================================
// MQTT
// ============================================================================
const client = mqtt.connect(`wss://${MQTT_HOST}:${MQTT_WSS_PORT}/mqtt`, {
  username: MQTT_USER,
  password: MQTT_PASS,
  clientId: 'pwa-' + Math.random().toString(16).slice(2,10),
  reconnectPeriod: 2000,
  clean: true
});

client.on('connect', () => {
  mqttConnected = true;
  client.subscribe([TOPIC_STATUS, TOPIC_AVAIL, TOPIC_ACK]);
  render();
});
client.on('reconnect', () => { mqttConnected = false; render(); });
client.on('close',     () => { mqttConnected = false; render(); });
client.on('offline',   () => { mqttConnected = false; render(); });

client.on('message', (topic, payload) => {
  const msg = payload.toString();

  if (topic === TOPIC_STATUS) {
    try {
      const s = JSON.parse(msg);
      const prevMode = status.mode;
      status = {
        mode: s.mode, program: s.program,
        remainSec: Number(s.remainSec)||0, actualRpm: Number(s.actualRpm)||0,
        capRpm: Number(s.capRpm)||0, flags: Number(s.flags)||0, label: s.label
      };
      if (status.mode !== 'PAUSED') changingProgram = false;
      if (status.mode !== 'DONE')   forceSelector   = false;
      displayRemain = status.remainSec;
      restartCountdown();
      render();
    } catch (e) { /* malformed JSON — ignore */ }

  } else if (topic === TOPIC_AVAIL) {
    deviceOnline = (msg === 'online');
    render();

  } else if (topic === TOPIC_ACK) {
    if (ERR_MESSAGES[msg]) showToast(ERR_MESSAGES[msg]);
  }
});

// ============================================================================
// COUNTDOWN (smooth 1Hz local tick between ~1Hz status messages)
// ============================================================================
function restartCountdown() {
  if (countdownTimer) clearInterval(countdownTimer);
  countdownTimer = null;
  if (status.mode === 'RUNNING') {
    countdownTimer = setInterval(() => {
      if (displayRemain > 0) { displayRemain--; updateReadout(); }
    }, 1000);
  }
}

// ============================================================================
// COMMANDS
// ============================================================================
function sendCmd(cmd) {
  if (!mqttConnected) { showToast('غير متصل بالخادم'); return; }
  client.publish(TOPIC_CMD, cmd);
}
function start()        { sendCmd(`RSTART ${selProgram} ${selCap}`); }
function stop()         { sendCmd('RSTOP'); }
function resume()       { sendCmd('RRESUME'); }
function changeConfirm(){ sendCmd(`RCHANGE ${selProgram} ${selCap}`); changingProgram = false; render(); }
function showChangeProgram() { changingProgram = true; render(); }
function resetToIdle()  { forceSelector = true; render(); }
function selectProgram(p){ selProgram = p; render(); }
function selectCap(c)    { selCap = c; render(); }

// ============================================================================
// RENDER
// ============================================================================
function modeColor(mode) {
  switch(mode) {
    case 'RUNNING':           return 'var(--accent-run)';
    case 'DONE':              return 'var(--accent-ok)';
    case 'FAULT':             return 'var(--accent-danger)';
    case 'PAUSING':
    case 'PAUSED':            return 'var(--text-dim)';
    default:                  return 'var(--text-dim)';
  }
}

function updateReadout() {
  const m = Math.floor(displayRemain/60), s = displayRemain%60;
  document.getElementById('timer').textContent =
    (status.mode==='IDLE') ? '--:--' : `${pad(m)}:${pad(s)}`;

  const rpmTxt = (status.mode==='IDLE')
    ? `الغطاء ${selCap} RPM`
    : `${status.actualRpm} RPM  •  الغطاء ${status.capRpm||selCap}`;
  document.getElementById('subread').textContent = rpmTxt;

  // ring
  const total = PROGRAM_TOTAL[status.program] || PROGRAM_TOTAL[selProgram] || 900;
  let frac;
  if (status.mode==='IDLE')      frac = 1;
  else if (status.mode==='DONE') frac = 0;
  else                            frac = Math.max(0, Math.min(1, displayRemain/total));
  const ring = document.getElementById('ringFg');
  ring.style.strokeDashoffset = (RING_C * (1-frac)).toFixed(1);
  ring.style.stroke = modeColor(status.mode);

  document.getElementById('drum').classList.toggle('spin', status.mode==='RUNNING');
  document.getElementById('phaseLabel').textContent = LABELS[status.label] || status.label || '';
  document.getElementById('phaseLabel').style.color = modeColor(status.mode);
}

function programSelectorHTML(btnLabel, btnAction) {
  const caps = [400,600,800,1000].map(c =>
    `<button class="btn ${selCap===c?'selected':''}" onclick="selectCap(${c})">${c}</button>`
  ).join('');
  return `
    <div class="btn-row">
      <button class="btn ${selProgram==='Q15'?'selected':''}" onclick="selectProgram('Q15')">
        ${PROGRAM_NAMES.Q15}<small>${PROGRAM_SUB.Q15}</small>
      </button>
      <button class="btn ${selProgram==='SPIN'?'selected':''}" onclick="selectProgram('SPIN')">
        ${PROGRAM_NAMES.SPIN}<small>${PROGRAM_SUB.SPIN}</small>
      </button>
    </div>
    <div class="btn-row">${caps}</div>
    <button class="btn primary" onclick="${btnAction}">${btnLabel}</button>
  `;
}

function renderPanel() {
  const panel = document.getElementById('panel');
  const m = status.mode;

  if (m === 'PAUSED') {
    if (changingProgram) {
      panel.innerHTML = programSelectorHTML('تأكيد التغيير', 'changeConfirm()')
        + `<button class="btn ghost" onclick="changingProgram=false; render()">رجوع</button>`;
    } else {
      const pname = PROGRAM_NAMES[status.program] || status.program;
      panel.innerHTML = `
        <div class="alert">⚠ انقطع الاتصال أثناء «${pname}».<br>الوقت متوقف عند الوقت المعروض أعلاه.</div>
        <button class="btn success" onclick="resume()">متابعة من حيث توقفت</button>
        <div class="btn-row">
          <button class="btn" onclick="showChangeProgram()">تغيير البرنامج</button>
          <button class="btn danger" onclick="stop()">إيقاف نهائي</button>
        </div>`;
    }
    return;
  }

  if (m === 'RUNNING' || m === 'PAUSING') {
    const note = (m==='PAUSING')
      ? `<div class="alert">جارٍ الإيقاف الآمن... سيتم تجميد الدورة بعد ثوانٍ</div>` : '';
    panel.innerHTML = `${note}<button class="btn danger" onclick="stop()">إيقاف الدورة</button>`;
    return;
  }

  if (m === 'DONE' && !forceSelector) {
    panel.innerHTML = `
      <div class="alert ok">✓ اكتملت دورة «${PROGRAM_NAMES[status.program]||status.program}» بنجاح</div>
      <button class="btn primary" onclick="resetToIdle()">دورة جديدة</button>`;
    return;
  }

  if (m === 'FAULT') {
    panel.innerHTML = `<div class="alert danger">⚠ عطل بالجهاز — يرجى التحقق من الغسالة شخصياً</div>`;
    return;
  }

  // IDLE (or DONE+forceSelector)
  panel.innerHTML = programSelectorHTML('ابدأ الدورة', 'start()');
}

function render() {
  // connectivity dot + banner
  const dot = document.getElementById('dot');
  const dotLabel = document.getElementById('dotLabel');
  const banner = document.getElementById('connBanner');

  if (!mqttConnected) {
    dot.className = 'dot';
    dotLabel.textContent = 'يتصل...';
    banner.style.display = 'block';
    banner.className = 'banner';
    banner.textContent = 'جارٍ الاتصال بالخادم...';
  } else if (!deviceOnline) {
    dot.className = 'dot offline';
    dotLabel.textContent = 'غير متصلة';
    banner.style.display = 'block';
    banner.className = 'banner warn';
    banner.textContent = '⚠ الغسالة غير متصلة بالإنترنت حالياً (آخر حالة معروضة قد تكون قديمة)';
  } else {
    dot.className = 'dot online';
    dotLabel.textContent = 'متصلة';
    banner.style.display = 'none';
  }

  updateReadout();
  renderPanel();
}

// ============================================================================
// TOAST
// ============================================================================
let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 3000);
}

// ============================================================================
// INIT
// ============================================================================
render();

// Optional service worker (Android "Add to Home Screen" niceties).
// Safe no-op if sw.js is missing or the browser doesn't support it.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
